<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shift · Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --surface:#161b24; --surface2:#1d2530; --line:#28303d;
  --text:#e9ecf1; --muted:#7f8a9b; --faint:#576273;
  --morning:#f5a623; --afternoon:#3f8bf6; --night:#9b6cf6;
  --off:#28c76f; --vac:#f472b6; --alert:#ff5d5d; --warn:#f5a623;
  --g1:rgba(155,108,246,.10); --g2:rgba(63,139,246,.06);
  --display:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif;
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f6; --line:#e1e5ec;
  --text:#141922; --muted:#5c6675; --faint:#9aa3b2;
  --morning:#c9790d; --afternoon:#2563eb; --night:#7c3aed;
  --off:#15a34a; --vac:#db2777; --alert:#e5484d; --warn:#b45309;
  --g1:rgba(124,58,237,.07); --g2:rgba(37,99,235,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);height:100%}
body{background:radial-gradient(90% 40% at 50% -5%,var(--g1),transparent 60%),var(--bg);overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.shell{display:grid;grid-template-columns:288px 1fr;height:100vh}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.side .brand .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
.side .brand h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-top:3px}
.searchwrap{padding:14px 14px 10px}
.searchwrap input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-family:var(--body);font-size:13.5px;padding:10px 12px;outline:none}
.searchwrap input:focus{border-color:var(--afternoon)}
.emplist{flex:1;overflow-y:auto;padding:0 8px 8px}
.eitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:.1s}
.eitem:hover{background:var(--surface2)}
.eitem.on{background:var(--surface2);box-shadow:inset 0 0 0 1.4px var(--afternoon)}
.eitem .av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:11px;color:#fff;background:var(--afternoon)}
.eitem .nm{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem .mini{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.side .foot{border-top:1px solid var(--line);padding:12px 14px}
.rolebox{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.roles{display:flex;gap:5px}
.roles button{flex:1;font-family:var(--display);font-weight:600;font-size:12px;color:var(--muted);background:var(--surface2);
  border:1px solid var(--line);padding:8px;border-radius:9px;transition:.13s}
.roles button.on{color:#fff;background:var(--afternoon);border-color:transparent}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.vtabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.vtabs button{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);padding:8px 16px;border-radius:8px;transition:.13s}
.vtabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.vtabs button .badge2{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:9.5px;background:var(--alert);color:#fff;border-radius:999px;padding:1px 6px}
.spacer{flex:1}
.tb{display:flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding:0 10px;background:var(--surface2);
  border:1px solid var(--line);border-radius:10px;color:var(--muted);transition:.13s;font-family:var(--mono);font-size:11.5px}
.tb:hover{color:var(--text)} .tb.flag{font-size:18px;padding:0 9px}
.content{flex:1;overflow:auto;padding:22px}

/* grid view */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:100%}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.grid thead th{position:sticky;top:0;z-index:3;background:var(--surface2);font-family:var(--mono);font-weight:500;
  font-size:10px;color:var(--muted);padding:8px 4px;text-align:center;min-width:40px;line-height:1.5}
table.grid thead th.wk{color:var(--faint)}
table.grid thead th.tdy{color:var(--text);background:var(--afternoon);color:#fff}
table.grid th.nameh{position:sticky;left:0;z-index:5;text-align:left;padding-left:14px;min-width:172px}
table.grid td.name{position:sticky;left:0;z-index:2;background:var(--surface);font-family:var(--display);font-weight:600;
  font-size:12.5px;padding:0 14px;white-space:nowrap;cursor:pointer}
table.grid tr.selrow td.name{color:var(--afternoon)}
table.grid tr.selrow td{background:var(--surface2)}
table.grid td.cell{padding:0;text-align:center;height:32px;cursor:pointer;position:relative}
.cellin{height:22px;margin:5px 3px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;font-weight:500;color:#fff;transition:.1s}
.cellin:hover{transform:scale(1.12)}
.cellin.o{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.cellin.v{background:var(--vac)}
.cellin.n{background:transparent;color:var(--faint);opacity:.3}
td.cell.selc .cellin{box-shadow:0 0 0 2px var(--text)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 4px 0;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* day view */
.dayhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dayhead h2{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em}
.dayhead .sub{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.hero{border-radius:16px;padding:20px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden;margin-bottom:16px}
.hero .glow{position:absolute;inset:0;opacity:.15;background:radial-gradient(70% 130% at 10% 0%,var(--accent),transparent 60%)}
.tagrow{display:flex;align-items:center;gap:10px;position:relative}
.badge{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px;color:#fff}
.loc{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.time{font-family:var(--mono);font-size:15px;color:var(--muted)}.time b{color:var(--text);font-weight:500}
.clock{margin-top:16px;position:relative}
.clock .track{height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:hidden}
.clock .seg{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.9}
.clock .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);z-index:3}
.clock .ticks{display:flex;justify-content:space-between;margin-top:5px}
.clock .ticks span{font-family:var(--mono);font-size:9px;color:var(--faint)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.block .lab{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.block .lab .ic{width:7px;height:7px;border-radius:50%}
.block .lab .t{font-family:var(--display);font-weight:600;font-size:13.5px}
.block .lab .s{font-family:var(--mono);font-size:10px;color:var(--muted)}
.floor{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.floor:first-of-type{border-top:none}
.floor .fl{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:0 0 62px}
.floor .fl.mine{color:var(--off);font-weight:700}
.floor .nm{font-size:13px;line-height:1.5}
.floor .nm .ot{font-family:var(--mono);font-size:10px;color:var(--vac);margin-left:3px}
.empty{color:var(--faint);font-size:12.5px;font-style:italic}
.rest{border-radius:16px;padding:26px 22px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden;margin-bottom:16px}
.rest .glow{position:absolute;inset:0;opacity:.2;background:radial-gradient(60% 120% at 15% 10%,var(--accent),transparent 60%)}
.rest .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);position:relative}
.rest h2{font-family:var(--display);font-weight:700;font-size:27px;margin-top:6px;color:var(--accent);position:relative}
.rest p{color:var(--muted);font-size:13px;margin-top:6px;position:relative;font-family:var(--mono)}
.d4{border-radius:12px;padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.d4 .dt{width:9px;height:9px;border-radius:50%}
.d4.bad{background:rgba(255,93,93,.09);border:1px solid rgba(255,93,93,.35)}.d4.bad .dt{background:var(--alert)}.d4.bad b{color:var(--alert)}
.d4.ok{background:rgba(63,139,246,.08);border:1px solid rgba(63,139,246,.3)}.d4.ok .dt{background:var(--afternoon)}.d4.ok b{color:var(--afternoon)}
.daylabel{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13.5px;margin:18px 2px 10px}
.daylabel span{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.swapcta{margin-left:auto;position:relative}
.btn{font-family:var(--display);font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;transition:.13s;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.btn:hover{border-color:var(--afternoon)}
.btn.primary{background:var(--afternoon);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--off);color:#fff;border-color:transparent}
.btn.danger{background:transparent;color:var(--alert);border-color:rgba(255,93,93,.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:12px;padding:7px 12px}

/* swaps */
.swapgrid{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:4px}
.card .hint{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:14px;line-height:1.6}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--text);
  font-family:var(--body);font-size:13px;padding:10px;outline:none}
.field select:focus,.field textarea:focus{border-color:var(--afternoon)}
.field textarea{resize:vertical;min-height:62px}
.vbox{border-radius:11px;padding:12px 14px;margin:6px 0 14px;font-size:12.5px;line-height:1.6}
.vbox.ok{background:rgba(40,199,111,.08);border:1px solid rgba(40,199,111,.35)}
.vbox.ok b{color:var(--off)}
.vbox.bad{background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.35)}
.vbox.bad b{color:var(--alert)}
.vbox .li{font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--muted)}
.vbox .li b{color:var(--alert)}
.reqlist{display:flex;flex-direction:column;gap:12px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.req .rh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.req .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.st.pending{background:rgba(245,166,35,.14);color:var(--warn)}
.st.approved{background:rgba(40,199,111,.14);color:var(--off)}
.st.rejected{background:rgba(255,93,93,.12);color:var(--alert)}
.req .rid{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
.swapviz{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:10px;padding:16px}
.leg{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px}
.leg .who{font-family:var(--display);font-weight:700;font-size:13.5px;margin-bottom:7px}
.leg .det{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
.leg .pill2{display:inline-block;font-family:var(--mono);font-size:9.5px;color:#fff;padding:2px 7px;border-radius:999px;margin-right:5px}
.arrows{text-align:center;font-size:19px;color:var(--afternoon)}
.chat{border-top:1px solid var(--line);padding:12px 16px;background:var(--surface2)}
.chat .msgs{display:flex;flex-direction:column;gap:7px;max-height:190px;overflow-y:auto;margin-bottom:9px}
.msg{font-size:12.5px;line-height:1.5;padding:8px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);max-width:82%}
.msg.me{align-self:flex-end;background:var(--afternoon);color:#fff;border-color:transparent}
.msg .au{display:block;font-family:var(--mono);font-size:9px;opacity:.75;margin-bottom:2px}
.msg.sys{align-self:center;max-width:100%;background:transparent;border:none;font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center}
.chatin{display:flex;gap:7px}
.chatin input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:13px;padding:9px 11px;outline:none}
.chatin input:focus{border-color:var(--afternoon)}
.acts{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.acts .note{font-family:var(--mono);font-size:10px;color:var(--faint);align-self:center;margin-left:auto}
.emptybox{text-align:center;padding:44px 20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:var(--surface)}
.emptybox h3{font-family:var(--display);font-weight:700;font-size:16px;color:var(--text);margin-bottom:6px}
.emptybox p{font-size:13px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--off);
  border-radius:11px;padding:13px 17px;box-shadow:0 16px 44px rgba(0,0,0,.4);z-index:80;max-width:370px}
.toast .tt{font-family:var(--display);font-weight:700;font-size:13.5px;margin-bottom:3px}
.toast .tx{font-size:12.5px;color:var(--muted);line-height:1.5}
.langmenu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:5px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:2px}
.langmenu div{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 15px 8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.langmenu div .fl{font-size:16px}
.langmenu div.on{background:var(--surface2);color:var(--text)}
.pickday{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow-y:auto;padding:2px}
.pickday button{font-family:var(--mono);font-size:10.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface2);color:var(--muted);transition:.1s}
.pickday button:hover{color:var(--text)}
.pickday button.on{color:#fff;border-color:transparent}
[hidden]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="k" id="kicker">Roster · Malta</div><h1 id="appTitle">My Shift</h1></div>
    <div class="searchwrap"><input id="q" type="text" placeholder="Search employee..."></div>
    <div class="emplist" id="emplist"></div>
    <div class="foot">
      <div class="rolebox" id="roleLabel">Access level</div>
      <div class="roles">
        <button id="roleEmp" class="on">Employee</button>
        <button id="roleCtl">Controller</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="vtabs">
        <button data-v="grid" class="on" id="tabGrid">Roster</button>
        <button data-v="day" id="tabDay">Day</button>
        <button data-v="swap" id="tabSwap">Swaps</button>
      </div>
      <div class="spacer"></div>
      <button class="tb" id="todayBtn">Today</button>
      <button class="tb flag" id="langBtn">🇬🇧</button>
      <button class="tb" id="themeBtn"></button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="langmenu" id="langMenu" hidden></div>
<div id="toastWrap"></div>

  if(n!==undefined&&s)s=s.replace('{n}',n);return s;}
function tp(per){return t(PERKEY[per])||per;}
function flagOf(c){const f=LANGS.find(l=>l[0]===c);return f?f[2]:c;}
function pad(n){return String(n).padStart(2,'0');}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ddmm(iso){return iso.slice(8)+'/'+iso.slice(5,7);}
function wdOf(iso){return new Date(iso+'T00:00').getDay();}
function firstName(n){return n.split(' ')[0];}
function initials(n){const p=n.split(' ');return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function allDates(){const out=[];let i=META.start;while(i<=META.end){out.push(i);i=addDays(i,1);}return out;}
const DATES=allDates();

/* ---------- escala com overrides aplicados ---------- */
function recOf(iso,emp){
  const k=iso+'|'+emp;
  if(OVERRIDES[k]!==undefined) return OVERRIDES[k];
  return (ROSTER[iso]||{})[emp]||null;
}
function scheduleOf(emp){
  const out={};
  DATES.concat([addDays(META.start,-1),addDays(META.end,1)]).forEach(d=>{const r=recOf(d,emp);if(r)out[d]=r;});
  return out;
}
function workersOn(iso,per,opt){
  opt=opt||{};const by={};
  const names=new Set(Object.keys(ROSTER[iso]||{}));
  EMPLOYEES.forEach(n=>{if(OVERRIDES[iso+'|'+n]!==undefined)names.add(n);});
  names.forEach(name=>{
    const r=recOf(iso,name);
    if(!r||r.s!=='w'||r.p!==per)return;
    if(opt.exclude&&name===opt.exclude)return;
    if(opt.dropLoc&&r.l===opt.dropLoc)return;
    const std=PADRAO[per];
    const ot=(std&&r.i&&r.f&&(r.i!==std[0]||r.f!==std[1]))?(r.i+'-'+r.f):null;
    (by[r.l]=by[r.l]||[]).push({n:name,ot});
  });
  const out=[];
  LOC_ORDER.forEach(loc=>{if(by[loc]){by[loc].sort((a,b)=>a.n.localeCompare(b.n));out.push({loc,people:by[loc]});}});
  return out;
}

/* ---------- REGRA DAS 12 HORAS ---------- */
function shiftIv(iso,ini,fim){
  const s=new Date(iso+'T'+ini+':00');
  let e=new Date(iso+'T'+fim+':00');
  if(e<=s)e=new Date(e.getTime()+864e5);
  return [s,e];
}
function restIssues(sched){
  const list=[];
  for(const d in sched){const r=sched[d];if(r&&r.s==='w'&&r.i&&r.f)list.push({date:d,per:r.p,iv:shiftIv(d,r.i,r.f)});}
  list.sort((a,b)=>a.iv[0]-b.iv[0]);
  const out=[];
  for(let i=0;i<list.length-1;i++){
    const gap=(list[i+1].iv[0]-list[i].iv[1])/36e5;
    if(gap<MIN_REST) out.push({a:list[i],b:list[i+1],gap:Math.max(0,Math.round(gap*10)/10)});
  }
  return out;
}
function fmtShift(x){return ddmm(x.date)+' '+tp(x.per);}
/* valida a troca: A entrega dateA, B entrega dateB; eles trocam */
function validateSwap(empA,dateA,empB,dateB){
  const issues=[];
  const rA=recOf(dateA,empA), rB=recOf(dateB,empB);
  if(!rA||rA.s!=='w'||!rB||rB.s!=='w')return{ok:false,issues:[t('selShift')]};
  if(empA===empB)return{ok:false,issues:['—']};
  // conflito: ja tem turno no dia que vai receber
  if(dateA!==dateB){
    const cA=recOf(dateB,empA), cB=recOf(dateA,empB);
    if(cA&&cA.s==='w')issues.push(t('conflict').replace('{n}',firstName(empA)).replace('{d}',ddmm(dateB)));
    if(cB&&cB.s==='w')issues.push(t('conflict').replace('{n}',firstName(empB)).replace('{d}',ddmm(dateA)));
  }
  // escalas propostas
  const sA=scheduleOf(empA), sB=scheduleOf(empB);
  delete sA[dateA]; sA[dateB]=rB;
  delete sB[dateB]; sB[dateA]=rA;
  [[empA,sA],[empB,sB]].forEach(([nm,sc])=>{
    restIssues(sc).forEach(x=>{
      issues.push(firstName(nm)+': '+t('restBroken').replace('{h}',x.gap).replace('{a}',fmtShift(x.a)).replace('{b}',fmtShift(x.b)));
    });
  });
  return {ok:issues.length===0,issues};
}

/* ---------- UI helpers ---------- */
function accentOf(r){
  if(!r)return 'var(--faint)';
  if(r.s==='w')return PHEX[r.p]||'#3f8bf6';
  if(r.s==='o')return 'var(--off)';
  if(r.s==='v')return 'var(--vac)';
  return 'var(--faint)';
}
function toast(title,txt,color){
  const w=document.getElementById('toastWrap');
  const el=document.createElement('div');el.className='toast';
  if(color)el.style.borderLeftColor=color;
  el.innerHTML=`<div class="tt">${title}</div><div class="tx">${txt}</div>`;
  w.appendChild(el);setTimeout(()=>el.remove(),5200);
}

/* ---------- view: day ---------- */
function groupsHTML(groups,mine){
  if(!groups.length)return `<div class="empty">${t('nobody')}</div>`;
  return groups.map(g=>{
    const names=g.people.map(p=>p.n+(p.ot?`<span class="ot">${p.ot}</span>`:'')).join(', ');
    return `<div class="floor"><div class="fl${g.loc===mine?' mine':''}">${g.loc===mine?g.loc+' ★':g.loc}</div><div class="nm">${names}</div></div>`;
  }).join('');
}
function dayWorkHTML(iso){
  let blocks='',total=0;
  ['Manhã','Tarde','Noite'].forEach(per=>{
    const g=workersOn(iso,per);if(!g.length)return;
    total+=g.reduce((a,x)=>a+x.people.length,0);
    const std=PADRAO[per];
    blocks+=`<div class="block"><div class="lab"><span class="ic" style="background:${PCOL[per]}"></span><span class="t">${tp(per)}</span><span class="s">${std[0]}–${std[1]}</span></div>${groupsHTML(g,null)}</div>`;
  });
  if(!total)return '';
  return `<div class="daylabel">${t('whoWorks')}<span>${t('people',total)}</span></div><div class="cols3">${blocks}</div>`;
}

/* ---------- view: swaps ---------- */
let swapForm={dateA:null,empB:null,dateB:null,msg:''};
function myWorkDays(emp){return DATES.filter(d=>{const r=recOf(d,emp);return r&&r.s==='w';});}
function renderSwap(){
  const c=document.getElementById('content');
  if(!selEmp){c.innerHTML=`<div class="emptybox"><h3>${t('employee')}</h3><p>${t('selCol')}</p></div>`;return;}
  const mine=myWorkDays(selEmp);
  if(!swapForm.dateA||!mine.includes(swapForm.dateA))swapForm.dateA=mine[0]||null;
  const theirs=swapForm.empB?myWorkDays(swapForm.empB):[];
  if(swapForm.dateB&&!theirs.includes(swapForm.dateB))swapForm.dateB=null;

  const rA=swapForm.dateA?recOf(swapForm.dateA,selEmp):null;
  const rB=(swapForm.empB&&swapForm.dateB)?recOf(swapForm.dateB,swapForm.empB):null;
  let val=null;
  if(rA&&rB)val=validateSwap(selEmp,swapForm.dateA,swapForm.empB,swapForm.dateB);

  let form=`<div class="card"><h3>${t('newReq')}</h3><div class="hint">${t('newReqHint')}</div>
    <div class="field"><label>${t('yourShift')}</label><div class="pickday" id="pickA">`;
  mine.forEach(d=>{const r=recOf(d,selEmp);
    form+=`<button data-d="${d}" class="${d===swapForm.dateA?'on':''}" style="${d===swapForm.dateA?'background:'+PHEX[r.p]:''}">${ddmm(d)} ${tp(r.p).slice(0,3)}</button>`;});
  form+=`</div></div>
    <div class="field"><label>${t('colleague')}</label><select id="selB"><option value="">${t('selCol')}</option>`;
  EMPLOYEES.filter(n=>n!==selEmp&&myWorkDays(n).length).forEach(n=>{
    form+=`<option value="${n}" ${n===swapForm.empB?'selected':''}>${n}</option>`;});
  form+=`</select></div>`;
  if(swapForm.empB){
    form+=`<div class="field"><label>${t('theirShift')}</label><div class="pickday" id="pickB">`;
    theirs.forEach(d=>{const r=recOf(d,swapForm.empB);
      form+=`<button data-d="${d}" class="${d===swapForm.dateB?'on':''}" style="${d===swapForm.dateB?'background:'+PHEX[r.p]:''}">${ddmm(d)} ${tp(r.p).slice(0,3)}</button>`;});
    form+=`</div></div>`;
  }
  if(val){
    form+=val.ok?`<div class="vbox ok"><b>✓ ${t('validOk')}</b><div class="li">${t('validOkTx')}</div></div>`
      :`<div class="vbox bad"><b>✕ ${t('validBad')}</b><div class="li">${t('validBadTx')}</div>`+
        val.issues.map(i=>`<div class="li">· ${i}</div>`).join('')+`</div>`;
  }
  form+=`<div class="field"><label>${t('msgToCol')}</label><textarea id="msgA" placeholder="${t('msgPh')}">${swapForm.msg||''}</textarea></div>
    <button class="btn primary" id="submitReq" ${(val&&val.ok)?'':'disabled'} style="width:100%">${t('submit')}</button></div>`;

  const visible=REQUESTS.filter(r=>role==='controller'||r.a===selEmp||r.b===selEmp);
  let list='';
  if(!visible.length){
    list=`<div class="emptybox"><h3>${role==='controller'?t('noReqCtl'):t('noReq')}</h3><p>${role==='controller'?t('noReqCtlTx'):t('noReqTx')}</p></div>`;
  } else {
    list='<div class="reqlist">'+visible.slice().reverse().map(r=>reqHTML(r)).join('')+'</div>';
  }
  c.innerHTML=`<div class="swapgrid">${form}<div>${list}</div></div>`;

  document.querySelectorAll('#pickA button').forEach(b=>b.onclick=()=>{swapForm.dateA=b.dataset.d;renderSwap();});
  document.querySelectorAll('#pickB button').forEach(b=>b.onclick=()=>{swapForm.dateB=b.dataset.d;renderSwap();});
  const sb=document.getElementById('selB');
  if(sb)sb.onchange=()=>{swapForm.empB=sb.value||null;swapForm.dateB=null;renderSwap();};
  const ma=document.getElementById('msgA');
  if(ma)ma.oninput=()=>{swapForm.msg=ma.value;};
  const su=document.getElementById('submitReq');
  if(su)su.onclick=submitRequest;
  bindReqEvents();
}

      <div class="arrows">⇄</div>

function bindReqEvents(){
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(+b.dataset.ap,true));
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>decide(+b.dataset.rj,false));
  document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.send;const inp=document.querySelector(`[data-chat="${id}"]`);
    if(inp&&inp.value.trim()){
      REQUESTS.find(r=>r.id===id).msgs.push({au:role==='controller'?t('controller'):selEmp,txt:inp.value.trim()});
      renderSwap();
    }});
  document.querySelectorAll('[data-chat]').forEach(inp=>inp.onkeydown=(e)=>{
    if(e.key==='Enter'){const id=+inp.dataset.chat;
      if(inp.value.trim()){REQUESTS.find(r=>r.id===id).msgs.push({au:role==='controller'?t('controller'):selEmp,txt:inp.value.trim()});renderSwap();}}});
  document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>sendMail(+b.dataset.mail));
}
function submitRequest(){
  const v=validateSwap(selEmp,swapForm.dateA,swapForm.empB,swapForm.dateB);
  if(!v.ok)return;
  const r={id:reqSeq++,a:selEmp,b:swapForm.empB,dateA:swapForm.dateA,dateB:swapForm.dateB,
    shiftA:recOf(swapForm.dateA,selEmp),shiftB:recOf(swapForm.dateB,swapForm.empB),
    status:'pending',msgs:[{sys:true,txt:t('sysCreated')}]};
  if(swapForm.msg&&swapForm.msg.trim())r.msgs.push({au:selEmp,txt:swapForm.msg.trim()});
  REQUESTS.push(r);
  swapForm={dateA:null,empB:null,dateB:null,msg:''};
  toast(t('pending'),`#${String(r.id).padStart(3,'0')} · ${firstName(r.a)} ⇄ ${firstName(r.b)}`,'var(--warn)');
  syncTabs();renderSwap();
}
function decide(id,ok){
  const r=REQUESTS.find(x=>x.id===id);if(!r||r.status!=='pending')return;
  if(ok){
    const v=validateSwap(r.a,r.dateA,r.b,r.dateB);
    if(!v.ok){toast(t('validBad'),v.issues[0],'var(--alert)');return;}
    // aplica na escala
    if(r.dateA===r.dateB){
      OVERRIDES[r.dateA+'|'+r.a]={...r.shiftB};
      OVERRIDES[r.dateA+'|'+r.b]={...r.shiftA};
    } else {
      OVERRIDES[r.dateA+'|'+r.a]={s:'o'};   // A deixa de trabalhar no dia dele
      OVERRIDES[r.dateB+'|'+r.a]={...r.shiftB}; // e assume o turno de B
      OVERRIDES[r.dateB+'|'+r.b]={s:'o'};   // B deixa de trabalhar no dia dele
      OVERRIDES[r.dateA+'|'+r.b]={...r.shiftA}; // e assume o turno de A
    }
    r.status='approved';r.msgs.push({sys:true,txt:t('sysApproved')});
    toast('✓ '+t('apprd'),t('apprdTx').replace('{a}',firstName(r.a)).replace('{b}',firstName(r.b)),'var(--off)');
  } else {
    r.status='rejected';r.msgs.push({sys:true,txt:t('sysRejected')});
    toast(t('rejd'),t('rejdTx').replace('{a}',firstName(r.a)).replace('{b}',firstName(r.b)),'var(--alert)');
  }
  renderEmps(document.getElementById('q').value);
  syncTabs();renderSwap();
}
function sendMail(id){
  const r=REQUESTS.find(x=>x.id===id);if(!r)return;
  const sub=`Shift swap #${String(r.id).padStart(3,'0')} approved — ${firstName(r.a)} / ${firstName(r.b)}`;
  const body=
`Shift swap request #${String(r.id).padStart(3,'0')} has been APPROVED.

${r.a}
  ${t('gives')}: ${ddmm(r.dateA)} ${tp(r.shiftA.p)} ${r.shiftA.i}-${r.shiftA.f} @ ${r.shiftA.l}
  ${t('gets')}:  ${ddmm(r.dateB)} ${tp(r.shiftB.p)} ${r.shiftB.i}-${r.shiftB.f} @ ${r.shiftB.l}

${r.b}
  ${t('gives')}: ${ddmm(r.dateB)} ${tp(r.shiftB.p)} ${r.shiftB.i}-${r.shiftB.f} @ ${r.shiftB.l}
  ${t('gets')}:  ${ddmm(r.dateA)} ${tp(r.shiftA.p)} ${r.shiftA.i}-${r.shiftA.f} @ ${r.shiftA.l}

Minimum rest of ${MIN_REST}h between shifts was verified for both employees.
The roster has been updated.`;
  window.location.href='mailto:?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
}

/* ---------- chrome ---------- */
function syncTabs(){
  document.querySelectorAll('.vtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const pend=REQUESTS.filter(r=>r.status==='pending'&&(role==='controller'||r.a===selEmp||r.b===selEmp)).length;
  document.getElementById('tabSwap').innerHTML=t('swaps')+(pend?`<span class="badge2">${pend}</span>`:'');
}
function applyStatic(){
  document.getElementById('appTitle').textContent=t('title');
  document.getElementById('kicker').textContent=t('kicker');
  document.getElementById('q').placeholder=t('searchPh');
  document.getElementById('roleLabel').textContent=t('access');
  document.getElementById('roleEmp').textContent=t('employee');
  document.getElementById('roleCtl').textContent=t('controller');
  document.getElementById('todayBtn').textContent=t('today');
  document.getElementById('tabGrid').textContent=t('roster');
  document.getElementById('tabDay').textContent=t('day');
  document.getElementById('langBtn').textContent=flagOf(lang);
  document.documentElement.lang=lang;
}
function render(){
  syncTabs();
  if(view==='grid')renderGrid();
  else if(view==='day')renderDay();
  else renderSwap();
}
function themeIcon(){return theme==='dark'
  ?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
  :'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';}

document.querySelectorAll('.vtabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
document.getElementById('q').oninput=e=>renderEmps(e.target.value);
document.getElementById('roleEmp').onclick=()=>{role='employee';document.getElementById('roleEmp').classList.add('on');document.getElementById('roleCtl').classList.remove('on');render();};
document.getElementById('roleCtl').onclick=()=>{role='controller';document.getElementById('roleCtl').classList.add('on');document.getElementById('roleEmp').classList.remove('on');render();};
document.getElementById('todayBtn').onclick=()=>{if(DATES.includes(todayISO()))selDate=todayISO();view=view==='swap'?'day':view;render();};
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;document.getElementById('themeBtn').innerHTML=themeIcon();};
document.getElementById('langBtn').onclick=e=>{e.stopPropagation();const m=document.getElementById('langMenu');
  if(!m.hidden){m.hidden=true;return;}
  m.innerHTML=LANGS.map(([c,l,f])=>`<div class="${c===lang?'on':''}" data-l="${c}"><span class="fl">${f}</span>${l}</div>`).join('');
  m.hidden=false;const r=e.target.getBoundingClientRect();m.style.top=(r.bottom+6)+'px';m.style.right=(window.innerWidth-r.right)+'px';
  m.querySelectorAll('div').forEach(d=>d.onclick=()=>{lang=d.dataset.l;m.hidden=true;applyStatic();render();});};
document.addEventListener('click',e=>{const m=document.getElementById('langMenu');if(!m.hidden&&e.target.id!=='langBtn')m.hidden=true;});

document.documentElement.dataset.theme=theme;
document.getElementById('themeBtn').innerHTML=themeIcon();
selDate=DATES.includes(todayISO())?todayISO():DATES[0];
applyStatic();renderEmps('');render();
</script>
</body>
</html>

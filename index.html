<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meu Turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --surface:#161b24; --surface2:#1d2530; --line:#28303d;
  --text:#e9ecf1; --muted:#7f8a9b; --faint:#576273;
  --morning:#f5a623; --afternoon:#3f8bf6; --night:#9b6cf6;
  --off:#28c76f; --vac:#f472b6; --alert:#ff5d5d;
  --display:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace; --body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--body)}
body{background:radial-gradient(120% 60% at 50% -10%, rgba(155,108,246,.10), transparent 60%),
  radial-gradient(90% 50% at 100% 0%, rgba(63,139,246,.06), transparent 55%),var(--bg);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
header{padding:22px 2px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;color:var(--faint);text-transform:uppercase}
.brand h1{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1}
.today-btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);padding:9px 13px;border-radius:11px;cursor:pointer;transition:.15s}
.today-btn:active{transform:scale(.96)} .today-btn.on{color:var(--text);border-color:#3a4557}

/* employee selector */
.empsel{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin:6px 0 14px;cursor:pointer;transition:.15s}
.empsel:active{transform:scale(.99)}
.empsel svg{flex:0 0 auto;stroke:var(--muted)}
.empsel .who{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.empsel .who small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
.empsel .chg{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--afternoon)}

/* rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;width:52px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:9px 0 8px;text-align:center;cursor:pointer;position:relative;transition:.15s}
.pill:active{transform:scale(.95)}
.pill .wd{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
.pill .dn{font-family:var(--display);font-weight:600;font-size:18px;margin-top:2px;line-height:1}
.pill .dot{height:4px;border-radius:3px;margin:7px 9px 0;background:var(--faint)}
.pill.sel{background:var(--surface2);box-shadow:inset 0 0 0 1.5px currentColor}
.pill.today .dn{color:#fff}
.pill.today::after{content:"";position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--text)}
@keyframes pulseToday{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.pill.flash{animation:pulseToday .75s ease-out}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:4px;margin:2px 0 18px}
.tab{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;transition:.15s}
.tab.on{background:var(--surface2);color:var(--text)}

/* hero */
.hero{border-radius:22px;padding:20px 20px 22px;border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.hero .glow{position:absolute;inset:0;opacity:.16;background:radial-gradient(90% 130% at 15% 0%,var(--accent),transparent 60%);pointer-events:none}
.hero .datel{display:flex;align-items:baseline;gap:9px;position:relative}
.hero .datel .big{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.hero .datel .sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tagrow{display:flex;align-items:center;gap:9px;margin-top:16px;position:relative;flex-wrap:wrap}
.badge{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 13px;border-radius:999px;color:#0c0f15}
.loc{font-family:var(--mono);font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--line);padding:6px 11px;border-radius:999px}
.time{font-family:var(--mono);font-size:15px;color:var(--muted);margin-left:auto}
.time b{color:var(--text);font-weight:500}
.clock{margin-top:20px;position:relative}
.clock .track{height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:hidden}
.clock .seg{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.9}
.clock .seg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%)}
.clock .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);z-index:3}
.clock .now::after{content:"agora";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;color:#fff}
.clock .ticks{display:flex;justify-content:space-between;margin-top:6px}
.clock .ticks span{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.rest{border-radius:22px;padding:30px 22px;border:1px solid var(--line);position:relative;overflow:hidden;background:var(--surface)}
.rest .glow{position:absolute;inset:0;opacity:.22;background:radial-gradient(80% 120% at 20% 10%,var(--accent),transparent 60%)}
.rest.big{box-shadow:0 0 0 1px transparent, 0 10px 34px -18px var(--accent)}
.rest .k{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);position:relative}
.rest h2{font-family:var(--display);font-weight:700;font-size:30px;margin-top:8px;letter-spacing:-.02em;position:relative;color:var(--accent)}
.daylabel{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--text);margin:20px 2px 11px;letter-spacing:-.01em}
.daylabel span{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--faint);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.rest p{color:var(--muted);font-size:13.5px;margin-top:8px;position:relative;font-family:var(--mono)}
.blocks{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.block .lab{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.block .lab .t{font-family:var(--display);font-weight:600;font-size:14px}
.block .lab .s{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.block .lab .ic{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.floor{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.floor:first-of-type{border-top:none}
.floor .fl{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 66px;padding-top:1px}
.floor .fl.mine{color:var(--off);font-weight:700}
.floor .nm{font-size:13.5px;line-height:1.5;color:var(--text)}
.floor .nm .ot{font-family:var(--mono);font-size:10.5px;color:var(--vac);margin-left:3px}
.empty{color:var(--faint);font-size:13px;font-style:italic}
.d4{border-radius:14px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;margin-top:2px}
.d4 .dt{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.d4.bad{background:rgba(255,93,93,.09);border:1px solid rgba(255,93,93,.35)}
.d4.bad .dt{background:var(--alert)} .d4.bad b{color:var(--alert)}
.d4.ok{background:rgba(63,139,246,.08);border:1px solid rgba(63,139,246,.3)}
.d4.ok .dt{background:var(--afternoon)} .d4.ok b{color:var(--afternoon)}
.d4 .mono{font-family:var(--mono);font-size:12px}

/* filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fgroup{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.fgroup::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);padding:7px 12px;border-radius:999px;cursor:pointer;transition:.13s;white-space:nowrap}
.fchip:active{transform:scale(.95)}
.fchip.on{color:var(--text);border-color:transparent;background:var(--surface2);box-shadow:inset 0 0 0 1.4px var(--afternoon)}
.count{font-family:var(--mono);font-size:11px;color:var(--faint);padding:0 2px 8px}

/* agenda */
.week{margin-bottom:16px}
.week .wh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px}
.week .wh .r{font-family:var(--display);font-weight:700;font-size:14px}
.week .wh .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.arow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:6px;cursor:pointer;transition:.12s}
.arow:active{transform:scale(.99)}
.arow .day{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 52px}
.arow .day b{color:var(--text);font-weight:500}
.arow .bar{width:3px;align-self:stretch;border-radius:3px;flex:0 0 3px}
.arow .txt{font-family:var(--display);font-weight:600;font-size:13.5px}
.arow .rt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.foot{text-align:center;color:var(--faint);font-family:var(--mono);font-size:10.5px;line-height:1.7;margin-top:22px;padding:0 10px}
.nav{display:flex;gap:8px;margin:16px 0 4px}
.nav button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:var(--display);font-weight:600;font-size:14px;padding:12px;border-radius:13px;cursor:pointer;transition:.15s}
.nav button:active{transform:scale(.97)}
.nav button:disabled{opacity:.3}

/* search overlay */
.ov{position:fixed;inset:0;background:rgba(6,8,12,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px}
.sheet{width:100%;max-width:448px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;max-height:78vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet-h{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.sheet-h input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  font-family:var(--body);font-size:15px;padding:11px 13px;outline:none}
.sheet-h input:focus{border-color:var(--afternoon)}
.sheet-h .cl{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:none;padding:0 8px;cursor:pointer}
.slist{overflow-y:auto;padding:6px}
.sitem{display:flex;align-items:center;gap:11px;padding:12px 12px;border-radius:11px;cursor:pointer;transition:.1s}
.sitem:active{background:var(--surface2)}
.sitem.cur{background:var(--surface2)}
.sitem .av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:12px;color:#0c0f15;background:var(--afternoon)}
.sitem .nm{font-family:var(--display);font-weight:600;font-size:14.5px}
.sitem .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
[hidden]{display:none!important}
</style>
</head>

<div class="app">
  <header>
    <div class="brand"><span class="kicker">Escala · Malta</span><h1>Meu Turno</h1></div>
    <button class="today-btn" id="todayBtn">Hoje</button>
  </header>
  <button class="empsel" id="empBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <span class="who"><small>Funcionário</small><span id="whoName">Pablo Targa</span></span>
    <span class="chg">trocar</span>
  </button>
  <div class="rail" id="rail"></div>
  <nav class="tabs">
    <div class="tab on" data-tab="today">Hoje</div>
    <div class="tab" data-tab="agenda">Agenda</div>
  </nav>
  <main id="viewToday"></main>
  <main id="viewAgenda" hidden></main>
</div>

<div class="ov" id="ov" hidden>
  <div class="sheet">
    <div class="sheet-h">
      <input id="q" type="text" placeholder="Buscar funcionário..." autocomplete="off">
      <button class="cl" id="closeOv">Fechar</button>
    </div>
    <div class="slist" id="slist"></div>
  </div>
</div>

const ROSTER = DATA.roster, EMPLOYEES = DATA.employees, META = DATA.meta;
const PHEX = {'Manhã':'#f5a623','Tarde':'#3f8bf6','Noite':'#9b6cf6'};
const PCOL = {'Manhã':'var(--morning)','Tarde':'var(--afternoon)','Noite':'var(--night)'};
const LOC_ORDER = ['Desk -1','Desk -4','Desk -5','Bugibba','Slots','n/d'];
const SITES = ['Bugibba','Desk -1','Desk -4','Desk -5','Slots'];
const PADRAO = {'Manhã':['07:00','15:00'],'Tarde':['15:00','23:00'],'Noite':['23:00','07:00']};
const PREV = {'Manhã':['Noite',-1,'saem 07:00'],'Tarde':['Manhã',0,'saem 15:00'],'Noite':['Tarde',0,'saem 23:00']};
const NEXT = {'Manhã':['Tarde',0,'entram 15:00'],'Tarde':['Noite',0,'entram 23:00'],'Noite':['Manhã',1,'entram 07:00']};
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDF=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

let selEmp = EMPLOYEES.includes('Pablo Targa') ? 'Pablo Targa' : EMPLOYEES[0];
let cur = 0, tab='today';
let filter = {tipo:'all', turno:'all', site:'all'};

function pad(n){return String(n).padStart(2,'0');}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ddmm(iso){return iso.slice(8)+'/'+iso.slice(5,7);}
function wdOf(iso){return new Date(iso+'T00:00').getDay();}
function firstName(n){return n.split(' ')[0];}

function workersOn(iso, per, opt){
  opt=opt||{};
  const day=ROSTER[iso]||{}; const by={};
  for(const name in day){
    const r=day[name];
    if(r.s!=='w' || r.p!==per) continue;
    if(opt.exclude && name===opt.exclude) continue;
    if(opt.dropLoc && r.l===opt.dropLoc) continue;
    const std=PADRAO[per];
    const ot=(std && r.i && r.f && (r.i!==std[0]||r.f!==std[1]))?(r.i+'-'+r.f):null;
    (by[r.l]=by[r.l]||[]).push({n:name,ot});
  }
  const out=[];
  for(const loc of LOC_ORDER){ if(by[loc]){ by[loc].sort((a,b)=>a.n.localeCompare(b.n)); out.push({loc,people:by[loc]});}}
  return out;
}

function buildDays(emp){
  const days=[]; let iso=META.start;
  while(iso<=META.end){
    const wd=wdOf(iso);
    const rec={date:iso,wd:WD[wd],wdFull:WDF[wd],dd:ddmm(iso)};
    const r=(ROSTER[iso]||{})[emp];
    if(r && r.s==='w'){
      rec.status='work'; rec.shift={per:r.p,ini:r.i,fim:r.f,loc:r.l};
      if(PREV[r.p]){
        const [pp,poff,psay]=PREV[r.p], [np,noff,nsay]=NEXT[r.p];
        rec.before={turno:pp,say:psay,groups:workersOn(addDays(iso,poff),pp)};
        rec.same={groups:workersOn(iso,r.p,{exclude:emp,dropLoc:r.l})};
        rec.after={turno:np,say:nsay,groups:workersOn(addDays(iso,noff),np)};
      } else { rec.before=null; rec.same={groups:workersOn(iso,r.p,{exclude:emp,dropLoc:r.l})}; rec.after=null; }
      if(r.l==='Desk -5'){
        const d4=(rec.same.groups.find(g=>g.loc==='Desk -4'));
        rec.desk4 = d4 ? {state:'covered',people:d4.people.map(p=>p.n)} : {state:'uncovered',people:[]};
      } else rec.desk4=null;
    } else if(r && r.s==='o'){ rec.status='off'; }
    else if(r && r.s==='v'){ rec.status='vac'; }
    else { rec.status='none'; }
    days.push(rec); iso=addDays(iso,1);
  }
  return days;
}
let DAYS = buildDays(selEmp);

function accentFor(d){
  if(d.status==='work') return PHEX[d.shift.per]||'#3f8bf6';
  if(d.status==='off') return '#28c76f';
  if(d.status==='vac') return '#f472b6';
  return '#576273';
}
function idxForToday(){const t=todayISO();let i=DAYS.findIndex(d=>d.date===t);if(i>=0)return i;if(t<DAYS[0].date)return 0;return DAYS.length-1;}

/* rail: buildRail cria (só ao trocar funcionario/init); markRail atualiza o dia selecionado sem recriar */
function buildRail(){
  const rail=document.getElementById('rail');rail.innerHTML='';const t=todayISO();
  DAYS.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='pill'+(i===cur?' sel':'')+(d.date===t?' today':'');
    el.style.color=accentFor(d);
    el.innerHTML=`<div class="wd">${d.wd}</div><div class="dn">${d.date.slice(8)}</div><div class="dot" style="background:${accentFor(d)}"></div>`;
    el.onclick=()=>{cur=i;tab='today';syncTabs();render();};
    rail.appendChild(el);
  });
}
function markRail(){
  const rail=document.getElementById('rail');if(!rail.children.length){buildRail();return;}
  [...rail.children].forEach((el,i)=>el.classList.toggle('sel',i===cur));
}
function scrollPill(i){const rail=document.getElementById('rail');const p=rail.children[i];if(!p)return;
  const left=Math.max(0,p.offsetLeft-rail.clientWidth/2+p.clientWidth/2);
  try{rail.scrollTo({left,behavior:'smooth'});}catch(e){rail.scrollLeft=left;}}
function flashToday(){
  const rail=document.getElementById('rail');const i=DAYS.findIndex(d=>d.date===todayISO());
  if(i<0)return;const p=rail.children[i];if(!p)return;
  p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash');
  setTimeout(()=>p.classList.remove('flash'),820);
}
function goToday(){
  cur=idxForToday();tab='today';syncTabs();render();
  scrollPill(cur);setTimeout(()=>{scrollPill(cur);flashToday();},60);
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectEmp(name){
  selEmp=name;DAYS=buildDays(selEmp);cur=idxForToday();
  document.getElementById('whoName').textContent=selEmp;
  buildRail();closeOv();tab='today';syncTabs();render();
  setTimeout(()=>scrollPill(cur),100);
}

/* 24h clock */
function hn(h){const[a,b]=h.split(':').map(Number);return a+b/60;}
function clockHTML(s,isToday){
  const a=hn(s.ini),b=hn(s.fim);let segs=b>a?[[a,b]]:[[a,24],[0,b]];
  let inner=segs.map(([x,y])=>`<div class="seg" style="left:${x/24*100}%;width:${(y-x)/24*100}%"></div>`).join('');
  if(isToday){const n=new Date();const h=n.getHours()+n.getMinutes()/60;inner+=`<div class="now" style="left:${h/24*100}%"></div>`;}
  return `<div class="clock"><div class="track">${inner}</div><div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>`;
}
function groupsHTML(groups,mineLoc){
  if(!groups||!groups.length)return `<div class="empty">ninguém escalado</div>`;
  return groups.map(g=>{
    const names=g.people.map(p=>p.n+(p.ot?`<span class="ot">${p.ot}</span>`:'')).join(', ');
    const mine=g.loc===mineLoc?' mine':'';const tag=g.loc===mineLoc?g.loc+' ★':g.loc;
    return `<div class="floor"><div class="fl${mine}">${tag}</div><div class="nm">${names}</div></div>`;
  }).join('');
}
function dayWorkHTML(iso){
  const pers=['Manhã','Tarde','Noite'];let blocks='';let total=0;
  for(const per of pers){
    const groups=workersOn(iso,per);
    if(!groups.length)continue;
    total+=groups.reduce((a,g)=>a+g.people.length,0);
    const std=PADRAO[per];
    blocks+=`<div class="block"><div class="lab"><span class="ic" style="background:${PCOL[per]}"></span><span class="t">${per}</span><span class="s">${std[0]}–${std[1]}</span></div>${groupsHTML(groups,null)}</div>`;
  }
  if(!total)return `<div class="daylabel">Ninguém escalado neste dia.</div>`;
  return `<div class="daylabel">Quem trabalha neste dia <span>${total} pessoa${total>1?'s':''}</span></div><div class="blocks">${blocks}</div>`;
}

function renderToday(){
  const d=DAYS[cur];const v=document.getElementById('viewToday');const acc=accentFor(d);const isToday=d.date===todayISO();
  const fn=firstName(selEmp);let html='';
  if(d.status==='work'){
    const s=d.shift;
    html+=`<section class="hero" style="--accent:${acc}"><div class="glow"></div>
      <div class="datel"><span class="big">${d.wdFull}</span><span class="sub">${d.dd}${isToday?' · hoje':''}</span></div>
      <div class="tagrow"><span class="badge" style="background:${acc}">${s.per}</span>
        <span class="loc">${s.loc}</span><span class="time"><b>${s.ini}</b>–<b>${s.fim}</b></span></div>
      ${clockHTML(s,isToday)}</section>`;
    if(d.desk4){
      if(d.desk4.state==='uncovered') html+=`<div class="d4 bad"><span class="dt"></span><div><b>Desk -4 sem cobertura</b> <span class="mono">no horário</span></div></div>`;
      else html+=`<div class="d4 ok"><span class="dt"></span><div><b>Desk -4 coberto:</b> ${d.desk4.people.join(', ')} <span class="mono">no horário</span></div></div>`;
    }
    html+=`<div class="blocks">`;
    if(d.before) html+=`<div class="block"><div class="lab"><span class="ic" style="background:${PCOL[d.before.turno]}"></span><span class="t">Passa pra ${fn}</span><span class="s">${d.before.turno} · ${d.before.say}</span></div>${groupsHTML(d.before.groups,s.loc)}</div>`;
    html+=`<div class="block"><div class="lab"><span class="ic" style="background:${acc}"></span><span class="t">No mesmo horário</span><span class="s">outros pisos</span></div>${groupsHTML(d.same.groups,null)}</div>`;
    if(d.after) html+=`<div class="block"><div class="lab"><span class="ic" style="background:${PCOL[d.after.turno]}"></span><span class="t">${fn} passa pra</span><span class="s">${d.after.turno} · ${d.after.say}</span></div>${groupsHTML(d.after.groups,s.loc)}</div>`;
    html+=`</div>`;
  } else {
    const k=d.status==='vac'?'Férias':d.status==='off'?'Folga':'Sem turno';
    const msg=d.status==='vac'?'Você está de férias. Veja quem cobre o dia.':d.status==='off'?'Dia livre pra você. Veja quem trabalha hoje.':'Nenhum turno definido na escala.';
    html+=`<section class="rest big" style="--accent:${acc};border-color:${acc}66"><div class="glow"></div><span class="k">${d.wdFull} · ${d.dd}${isToday?' · hoje':''}</span><h2>${k}</h2><p>${msg}</p></section>`;
    if(d.status==='off'||d.status==='vac') html+=dayWorkHTML(d.date);
  }
  html+=`<div class="nav"><button id="prev" ${cur===0?'disabled':''}>‹ Anterior</button><button id="next" ${cur===DAYS.length-1?'disabled':''}>Próximo ›</button></div>`;
  v.innerHTML=html;
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  if(pv)pv.onclick=()=>{if(cur>0){cur--;render();scrollPill(cur);}};
  if(nx)nx.onclick=()=>{if(cur<DAYS.length-1){cur++;render();scrollPill(cur);}};
}

/* agenda + filters */
function chip(group,val,label){return `<div class="fchip ${filter[group]===val?'on':''}" data-g="${group}" data-v="${val}">${label}</div>`;}
function passFilter(d){
  if(filter.tipo==='work' && d.status!=='work') return false;
  if(filter.tipo==='off' && d.status!=='off') return false;
  if(filter.tipo==='vac' && d.status!=='vac') return false;
  if(filter.turno!=='all'){ if(d.status!=='work'||d.shift.per!==filter.turno) return false; }
  if(filter.site!=='all'){ if(d.status!=='work'||d.shift.loc!==filter.site) return false; }
  return true;
}
function renderAgenda(){
  const v=document.getElementById('viewAgenda');
  const showTurnoSite = !(filter.tipo==='off'||filter.tipo==='vac');
  let fh=`<div class="filters">
    <div class="fgroup">${chip('tipo','all','Tudo')}${chip('tipo','work','Trabalho')}${chip('tipo','off','Folga')}${chip('tipo','vac','Férias')}</div>`;
  if(showTurnoSite){
    fh+=`<div class="fgroup">${chip('turno','all','Todo turno')}${chip('turno','Manhã','Manhã')}${chip('turno','Tarde','Tarde')}${chip('turno','Noite','Noite')}</div>
    <div class="fgroup">${chip('site','all','Todo site')}${SITES.map(s=>chip('site',s,s.replace('Desk ',''))).join('')}</div>`;
  }
  fh+=`</div>`;

  const filtered=DAYS.filter(passFilter);
  const active = !(filter.tipo==='all'&&filter.turno==='all'&&filter.site==='all');
  let body='';
  if(!filtered.length){ body=`<div class="count">nenhum dia com esse filtro</div>`; }
  else if(active){
    body=`<div class="count">${filtered.length} dia(s)</div>`;
    filtered.forEach(d=>body+=arow(d));
  } else {
    // por semana
    let weeks=[],w=[];
    DAYS.forEach(d=>{const wd=wdOf(d.date);if(w.length&&wd===1){weeks.push(w);w=[];}w.push(d);});
    if(w.length)weeks.push(w);
    weeks.forEach(wk=>{
      const nw=wk.filter(x=>x.status==='work').length,no=wk.filter(x=>x.status==='off').length,nv=wk.filter(x=>x.status==='vac').length;
      const c=`${nw} trab · ${no} folga`+(nv?` · ${nv} fér`:'');
      body+=`<div class="week"><div class="wh"><span class="r">${wk[0].dd} a ${wk[wk.length-1].dd}</span><span class="c">${c}</span></div>`;
      wk.forEach(d=>body+=arow(d));
      body+='</div>';
    });
  }
  body+=`<div class="foot">Pisos: Desk -1, -4, -5, Bugibba, Slots · ★ = mesmo posto (handover direto)<br>horário em rosa = OT/estendido · ${META.start.split('-').reverse().join('/')} a ${META.end.split('-').reverse().join('/')}</div>`;
  v.innerHTML=fh+body;
  v.querySelectorAll('.fchip').forEach(c=>c.onclick=()=>{
    const g=c.dataset.g,val=c.dataset.v; filter[g]=val;
    if(g==='tipo'&&(val==='off'||val==='vac')){filter.turno='all';filter.site='all';}
    renderAgenda();
  });
  v.querySelectorAll('.arow').forEach(el=>el.onclick=()=>{cur=parseInt(el.dataset.i);tab='today';syncTabs();render();scrollPill(cur);window.scrollTo({top:0,behavior:'smooth'});});
}
function arow(d){
  const acc=accentFor(d);const gi=DAYS.indexOf(d);let txt,rt='';
  if(d.status==='work'){txt=d.shift.per;rt=`${d.shift.loc} · ${d.shift.ini}–${d.shift.fim}`;}
  else if(d.status==='off')txt='Folga';else if(d.status==='vac')txt='Férias';else txt='Sem turno';
  return `<div class="arow" data-i="${gi}"><span class="day">${d.wd} <b>${d.date.slice(8)}</b></span>
    <span class="bar" style="background:${acc}"></span>
    <span class="txt" style="color:${d.status==='work'?acc:'var(--text)'}">${txt}</span><span class="rt">${rt}</span></div>`;
}

/* search overlay */
function initials(n){const p=n.split(' ');return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function openOv(){
  const ov=document.getElementById('ov');ov.hidden=false;
  const q=document.getElementById('q');q.value='';renderList('');setTimeout(()=>q.focus(),50);
}
function closeOv(){document.getElementById('ov').hidden=true;}
function renderList(term){
  term=term.toLowerCase();
  const list=document.getElementById('slist');
  const items=EMPLOYEES.filter(n=>n.toLowerCase().includes(term));
  list.innerHTML = items.length? items.map(n=>`<div class="sitem ${n===selEmp?'cur':''}" data-n="${n}">
      <span class="av">${initials(n)}</span><span class="nm">${n}</span>${n===selEmp?'<span class="tag">atual</span>':''}</div>`).join('')
    : `<div class="count" style="padding:16px">ninguém encontrado</div>`;
  list.querySelectorAll('.sitem').forEach(el=>el.onclick=()=>selectEmp(el.dataset.n));
}

function syncTabs(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.getElementById('viewToday').hidden=tab!=='today';
  document.getElementById('viewAgenda').hidden=tab!=='agenda';
}
function render(){
  markRail();
  if(tab==='today')renderToday();else renderAgenda();
  document.getElementById('todayBtn').classList.toggle('on',DAYS[cur]&&DAYS[cur].date===todayISO());
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;syncTabs();render();});
document.getElementById('todayBtn').onclick=goToday;
document.getElementById('empBtn').onclick=openOv;
document.getElementById('closeOv').onclick=closeOv;
document.getElementById('ov').onclick=(e)=>{if(e.target.id==='ov')closeOv();};
document.getElementById('q').oninput=(e)=>renderList(e.target.value);

cur=idxForToday();
document.getElementById('whoName').textContent=selEmp;
buildRail();
syncTabs();render();setTimeout(()=>scrollPill(cur),120);
</script>
</body>
